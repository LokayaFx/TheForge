# Recipe menu title supports {category}. Customize slots, materials, names and lore.
# PLAYER_HEAD sample: set `material: PLAYER_HEAD` and then add either
# `owner: PlayerName` or `texture: "Base64_TEXTURE_VALUE_OR_TEXTURE_URL"`.
title: "&8Recipes - {category}"
slots:
  recipes: [10, 11, 12, 13, 14, 15, 16, 19, 20, 21, 22, 23, 24, 25, 28, 29, 30, 31, 32, 33, 34, 37, 38, 39, 40, 41, 42, 43]
items:
  filler:
    material: GRAY_STAINED_GLASS_PANE
    name: " "
    lore: []
  header:
    slot: 4
    name: "&e{name}"
    lore:
      - "&7Recipes: &e{count}"
      - "&7Page: &e{page}&7/&e{pages}"
      - "&7Forge slot: &e{slot}"
  recipe-entry:
    # Omit lore to keep the ingredient details generated by the plugin.
    # If set, this list replaces all generated recipe lore.
  previous:
    slot: 45
    material: ARROW
    name: "&ePrevious Page"
    lore: []
  back:
    slot: 49
    material: ARROW
    name: "&eBack"
    lore: []
  close:
    slot: 51
    material: BARRIER
    name: "&cClose"
    lore: []
  next:
    slot: 53
    material: ARROW
    name: "&eNext Page"
    lore: []
